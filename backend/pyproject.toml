[project]
name = "hyperion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Arian Ott", email = "arian.ott@ieee.org" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "anyascii>=0.3.3",
    "argon2-cffi>=25.1.0",
    "asyncmy>=0.2.10",
    "faker>=39.0.0",
    "fastapi[all]>=0.126.0",
    "fastmcp>=2.14.2",
    "mcp>=1.25.0",
    "orjson>=3.11.5",
    "pwdlib>=0.3.0",
    "pyartnet>=2.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "python-slugify[unidecode]>=8.0.4",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.38.0",
]


[dependency-groups]
dev = [
    "pygount>=3.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-order>=1.3.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
addopts = "-s -v -p no:cacheprovider"

[tool.uv]
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

